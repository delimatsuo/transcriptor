# Generated by /deploy-setup — starter template, review TODOs before use
name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options: [staging, production]
      method:
        description: 'Rollback method'
        required: true
        type: choice
        options: [traffic-split, git-revert, redeploy-tag]
      revision_or_tag:
        description: 'Cloud Run revision or git tag'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: transcriptor-490222
  GCP_REGION: us-central1
  BACKEND_SERVICE: tars-backend

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2
        with:
          workload_identity_provider: 'projects/33726443105/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2

      - name: Rollback Cloud Run (traffic split)
        if: inputs.method == 'traffic-split'
        run: |
          gcloud run services update-traffic ${{ env.BACKEND_SERVICE }} \
            --to-revisions=${{ inputs.revision_or_tag }}=100 \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.GCP_REGION }}

      - name: Rollback (git revert + redeploy)
        if: inputs.method == 'git-revert' || inputs.method == 'redeploy-tag'
        run: |
          echo "TODO: Implement git-based rollback for ${{ inputs.environment }}"
          echo "Tag/revision: ${{ inputs.revision_or_tag }}"
