name: Build (deployment disabled)

# PHASE 0B CONTAINMENT: Automatic and manual deployment steps are intentionally
# absent. The remote workflow was also disabled through GitHub on 2026-07-15.
# Reintroducing deployment requires an isolated project, protected approval,
# authenticated Cloud Run, tests, and a new plan/release review.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # BLOCKER: Automated tests do not exist yet; installation/build is not a
      # sufficient production or privacy gate.
      # - name: Run backend tests
      #   run: pytest
      # - name: Run frontend tests
      #   run: cd frontend && npm test
