name: Build (deployment disabled)

# PHASE 0B CONTAINMENT: Automatic and manual deployment steps are intentionally
# absent. The remote workflow was also disabled through GitHub on 2026-07-15.
# Reintroducing deployment requires an isolated project, protected approval,
# authenticated Cloud Run, tests, and a new plan/release review.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # BLOCKER: Automated tests do not exist yet; installation/build is not a
      # sufficient production or privacy gate.
      # - name: Run backend tests
      #   run: pytest
      # - name: Run frontend tests
      #   run: cd frontend && npm test
