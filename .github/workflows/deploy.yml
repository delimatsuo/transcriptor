name: Deploy

on:
  push:
    branches: [staging, main]

permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: transcriptor-490222
  GCP_REGION: us-central1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # TODO: Add test commands when tests exist
      # - name: Run backend tests
      #   run: pytest
      # - name: Run frontend tests
      #   run: cd frontend && npm test

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      # Environment-specific service names
      BACKEND_SERVICE: ${{ github.ref == 'refs/heads/main' && 'tars-backend' || 'tars-backend-staging' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2
        with:
          workload_identity_provider: 'projects/33726443105/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-deploy@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2

      # Deploy backend to Cloud Run (Dockerfile at repo root)
      # NOTE: --allow-unauthenticated is intentional for staging.
      # TODO: Add Firebase Auth middleware before production deployment.
      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            --source . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=$GCP_PROJECT_ID"

      # Deploy frontend to Firebase Hosting
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Deploy to Firebase Hosting
        if: hashFiles('firebase.json') != ''
        run: |
          npm install -g firebase-tools@13.29.1
          firebase deploy --only hosting --project "$GCP_PROJECT_ID"
