# .claude/deploy-config.yaml
# Generated by /deploy-setup — consumed by /deploy
# Do not delete — /deploy relies on this file for project-specific values.

schema_version: 1

project:
  name: "transcriptor"
  platform: "firebase-hosting+cloud-run"
  # Frontend: Firebase Hosting (Next.js SSG/SSR)
  # Backend: Cloud Run (Python/FastAPI)

environments:
  staging:
    branch: "staging"
    url: "pending"
    gcp_project_id: "transcriptor-490222"
    health_check: "/api/sessions"
  production:
    branch: "main"
    url: "pending"
    gcp_project_id: "transcriptor-490222"
    health_check: "/api/sessions"

ci_cd:
  provider: "github-actions"
  deploy_workflow: ".github/workflows/deploy.yml"
  rollback_workflow: ".github/workflows/rollback.yml"
  auth_method: "workload-identity-federation"

reviewer:
  tech_stack: "Next.js, TypeScript, React, Firebase, Python 3.12, FastAPI, Google Cloud Speech-to-Text v2, Gemini, Firestore, Cloud Run, WebSocket"
  additional_rules: ""
